[package]
name = "luanti-network"
version = "0.1.0"
edition = "2021"
description = "Network protocol implementation for Luanti (Minetest)"
license = "LGPL-2.1-or-later"

[dependencies]
tokio = { workspace = true }
bytes = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
luanti-auth-db = { path = "../luanti-auth-db" }

# SRP-6a (SHA-256, 2048-bit) — RustCrypto PAKEs crate, RFC 5054 mode.
# We pin the last stable release (0.6) and use the lower-level public
# methods (`compute_b_pub`, `compute_premaster_secret`, `compute_u`,
# `compute_m1`, `compute_m2`) to delegate the bulk of the math to the
# crate while overriding only the `k = H(N || g)` computation to use
# the natural byte length of `g` (Luanti's C++ `srp.cpp` uses
# `hash_num(g)` which is unpadded — `srp 0.6`'s built-in `compute_k`
# pads `g` to `len(N)`, which would break interop with the C++ client).
# sha2 stays at 0.10 to match the srp 0.6 dep tree (digest 0.10).
srp = "0.6"
num-bigint = { version = "0.4", features = ["rand"] }
rand = "0.8"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"

# Compression for TOCLIENT_ITEMDEF / TOCLIENT_NODEDEF payloads.
# The C++ client expects zlib for protocol versions < 48 and zstd for
# protocol versions >= 48. The server must therefore produce a valid
# (non-empty) compressed stream — passing an empty buffer to the
# client makes its decompressor fail with EOF.
flate2 = "1.0"
zstd = "0.13"

[lib]
name = "luanti_network"
path = "src/lib.rs"
